<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра «Саймон»</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <h1>Игра «Саймон»</h1>

    <p class="level">Уровень: <strong id="level">0</strong></p>
    <p id="message" aria-live="polite">Нажмите «Старт», чтобы начать.</p>

    <div class="board" aria-label="Игровые кнопки">
      <button class="pad pad-red" data-index="0" aria-label="Красная кнопка" disabled></button>
      <button class="pad pad-green" data-index="1" aria-label="Зелёная кнопка" disabled></button>
      <button class="pad pad-blue" data-index="2" aria-label="Синяя кнопка" disabled></button>
      <button class="pad pad-yellow" data-index="3" aria-label="Жёлтая кнопка" disabled></button>
    </div>

    <button id="start-button" type="button">Старт</button>
  </main>
</body>
</html>
