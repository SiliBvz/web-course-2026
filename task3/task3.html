<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo</title>

  <link rel="stylesheet" href="task3.css">
  <script src="task3.js" defer></script>
</head>
<body>

  <h1>Список задач</h1>

  <form id="todo-form">
    <input id="task-input" type="text" placeholder="Введите задачу...">
    <button type="submit">Добавить</button>
  </form>

  <p id="warning" hidden>Введите текст задачи</p>

  <p id="counter">Осталось: 0, Выполнено: 0</p>

  <div id="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="active">Активные</button>
    <button class="filter-btn" data-filter="completed">Завершённые</button>
  </div>

  <ul id="task-list"></ul>

</body>
</html>
